name: Finalizar execução da Atividade 2

on:
  pull_request:
    types: [opened]
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.pull_request.head.ref == 'Proc_Img_Atividade_2' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch da atividade
        uses: actions/checkout@v4
        with:
          ref: Proc_Img_Atividade_2
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install nbformat nbclient ipykernel numpy matplotlib opencv-python-headless

      - name: Executar notebook e preservar outputs
        run: |
          python - <<'PY'
          import base64
          import json
          import subprocess
          from pathlib import Path

          import cv2
          import nbformat
          import numpy as np
          from nbclient import NotebookClient

          NOTEBOOK = Path('Proc_Img_Atividade_2.ipynb')
          PARENT = 'cd61f0e8304480ba62f68df59503cdbc3eb7440e'

          old_bytes = subprocess.check_output(
              ['git', 'show', f'{PARENT}:Proc_Img_Atividade_2.ipynb']
          )
          old_nb = json.loads(old_bytes.decode('utf-8'))

          image_code = next(
              ''.join(cell.get('source', []))
              for cell in old_nb['cells']
              if cell.get('cell_type') == 'code'
              and 'IMAGENS_B64' in ''.join(cell.get('source', []))
          )
          ns = {}
          exec(image_code, ns)
          imagens = ns['IMAGENS_B64']

          nomes = {
              'escura': 'foto_escura.jpg',
              'clara': 'foto_clara.jpg',
              'bem': 'foto_bem_exposta.jpg',
          }
          for chave, nome in nomes.items():
              Path(nome).write_bytes(base64.b64decode(imagens[chave]))

          img_clara = cv2.imread('foto_clara.jpg', cv2.IMREAD_GRAYSCALE)
          media_original = float(img_clara.mean())
          pct_240 = float((img_clara >= 240).mean() * 100)

          def gamma(img, valor):
              norm = img / 255.0
              return (255 * (norm ** valor)).astype(np.uint8)

          media_120 = float(gamma(img_clara, 1.20).mean())
          media_200 = float(gamma(img_clara, 2.00).mean())

          nb = nbformat.read(NOTEBOOK, as_version=4)

          for cell in nb.cells:
              if cell.cell_type == 'code':
                  src = cell.source

                  if 'from google.colab import files' in src:
                      cell.source = src.replace(
                          'from google.colab import files',
                          "try:\n    from google.colab import files\nexcept ImportError:\n    files = None"
                      )

                  if src.strip() == 'arquivos = files.upload()':
                      cell.source = """from pathlib import Path

nomes_imagens = [
    'foto_escura.jpg',
    'foto_clara.jpg',
    'foto_bem_exposta.jpg'
]

if all(Path(nome).exists() for nome in nomes_imagens):
    print('Imagens já disponíveis no ambiente; upload manual não necessário nesta execução.')
else:
    if files is None:
        raise FileNotFoundError(
            'As três imagens não estão no diretório atual e o ambiente não é Google Colab.'
        )
    arquivos = files.upload()
"""

                  if 'gamma_clara' in cell.source:
                      cell.source = cell.source.replace('gamma_clara = 1.20', 'gamma_clara = 2.0')
                      cell.source = cell.source.replace('gamma_clara = 5', 'gamma_clara = 2.0')

                  cell.outputs = []
                  cell.execution_count = None

              elif cell.cell_type == 'markdown':
                  src = cell.source

                  if '**Diagnóstico:**' in src and 'superexposição' in src:
                      cell.source = (
                          f"**Diagnóstico:** o histograma apresenta forte concentração nas intensidades altas, "
                          f"especialmente próximas ao limite superior de 255, caracterizando superexposição e "
                          f"saturação das regiões mais iluminadas. Na imagem usada nesta execução, a intensidade "
                          f"média é aproximadamente **{media_original:.2f}**, e cerca de **{pct_240:.1f}% dos pixels "
                          f"possuem intensidade maior ou igual a 240**. Por isso, parte dos detalhes das áreas mais "
                          f"claras já foi perdida na captura.\n\n"
                          f"**Operação escolhida:** correção de gamma com **γ = 2,00**. O valor **γ = 1,20** foi "
                          f"testado, mas produziu uma alteração visual discreta, com intensidade média de "
                          f"aproximadamente **{media_120:.2f}**. Com **γ = 2,00**, a média passa para cerca de "
                          f"**{media_200:.2f}**, tornando a correção mais perceptível. Como γ > 1, a transformação "
                          f"reduz as intensidades intermediárias e altas. Pixels que já estavam saturados em 255 "
                          f"permanecem saturados, portanto a operação não recupera informação perdida na captura."
                      )

                  if src.startswith('A operação fez menos diferença') or (
                      'imagem bem exposta' in src and 'γ = 1,20' in src and 'imagem clara/superexposta' in src
                  ):
                      cell.source = (
                          "A operação fez menos diferença na **imagem bem exposta**, porque seu histograma já "
                          "apresentava a maior parte das intensidades na região de tons médios e não mostrava "
                          "concentração excessiva nos extremos. Por esse motivo foi usado **γ = 1,05**, valor muito "
                          "próximo de 1, que produz apenas uma pequena alteração. Na **imagem escura**, foi usado "
                          "**γ = 0,55** para elevar as intensidades baixas e tornar os detalhes mais visíveis. Na "
                          "**imagem clara/superexposta**, o valor **γ = 1,20** mostrou-se visualmente pouco efetivo; "
                          "foi adotado **γ = 2,00**, que produz uma redução perceptível da luminosidade sem o "
                          "escurecimento excessivo observado com valores maiores. A correção gamma não recupera "
                          "detalhes de pixels que já atingiram o nível máximo de intensidade durante a captura."
                      )

          client = NotebookClient(
              nb,
              timeout=180,
              kernel_name='python3',
              resources={'metadata': {'path': '.'}},
          )
          nb = client.execute()

          erros = [
              output
              for cell in nb.cells if cell.cell_type == 'code'
              for output in cell.get('outputs', [])
              if output.get('output_type') == 'error'
          ]
          if erros:
              raise RuntimeError(f'Notebook executado com erros: {erros}')

          outputs = sum(
              len(cell.get('outputs', []))
              for cell in nb.cells
              if cell.cell_type == 'code'
          )
          if outputs < 6:
              raise RuntimeError(f'Quantidade inesperada de outputs: {outputs}')

          if not any(
              'gamma_clara = 2.0' in cell.source
              for cell in nb.cells
              if cell.cell_type == 'code'
          ):
              raise RuntimeError('gamma_clara = 2.0 não foi preservado.')

          nbformat.write(nb, NOTEBOOK)
          PY

      - name: Commitar a última execução
        run: |
          git config user.name "Pedro-Benitah"
          git config user.email "80503035+Pedro-Benitah@users.noreply.github.com"
          git add Proc_Img_Atividade_2.ipynb
          git commit -m "fix: preserva a última execução da atividade 2"
          git push origin HEAD:Proc_Img_Atividade_2
